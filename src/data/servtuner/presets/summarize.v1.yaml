name: summarize
version: 1
description: Long documents with short summaries, about 8192 tokens in and 512 out. Stresses long-context prefill and max_model_len.
engines: [loadgen]
workload:
  api: chat
  dataset:
    type: synthetic
    input_tokens: { mean: 8192, stddev: 2048 }
    output_tokens: { mean: 512, stddev: 128 }
slos:
  ttft_p95: 4s
  e2e_p95: 30s
rps_hint:
  - { gpu_class: rtx-3070-8gb, start_rps: 0.25 }
  - { gpu_class: a100-80gb, start_rps: 1 }
  - { gpu_class: h100-80gb, start_rps: 2 }
