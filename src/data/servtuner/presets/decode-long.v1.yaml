name: decode-long
version: 1
description: Short prompts with long generations, about 256 tokens in and 1536 out. Stresses decode, the KV pool and max_num_seqs.
engines: [loadgen]
workload:
  api: chat
  dataset:
    type: synthetic
    input_tokens: { mean: 256, stddev: 64 }
    output_tokens: { mean: 1536, stddev: 384 }
slos:
  ttft_p95: 1s
  itl_p95: 40ms
rps_hint:
  - { gpu_class: rtx-3070-8gb, start_rps: 1.5 }
  - { gpu_class: a100-80gb, start_rps: 3 }
  - { gpu_class: h100-80gb, start_rps: 6 }
