name: rag-prefill
version: 1
description: Retrieval-augmented chat, about 4096 tokens in (a 512-token system prompt shared by 4 groups, then retrieved context) and 256 out. Stresses prefill, chunked prefill and max_num_batched_tokens.
engines: [loadgen]
workload:
  api: chat
  dataset:
    type: synthetic
    input_tokens: { mean: 4096, stddev: 1024 }
    output_tokens: { mean: 256, stddev: 64 }
    shared_prefix: { tokens: 512, groups: 4 }
slos:
  ttft_p95: 2s
  itl_p95: 60ms
rps_hint:
  - { gpu_class: rtx-3070-8gb, start_rps: 0.5 }
  - { gpu_class: a100-80gb, start_rps: 4 }
  - { gpu_class: h100-80gb, start_rps: 8 }
