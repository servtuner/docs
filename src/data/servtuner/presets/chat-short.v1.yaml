name: chat-short
version: 1
description: Single-turn chat, about 256 tokens in and 256 out. The balanced baseline.
engines: [loadgen]
workload:
  api: chat
  dataset:
    type: synthetic
    input_tokens: { mean: 256, stddev: 64 }
    output_tokens: { mean: 256, stddev: 64 }
slos:
  ttft_p95: 500ms
  itl_p95: 50ms
rps_hint:
  - { gpu_class: rtx-3070-8gb, start_rps: 8 }
  - { gpu_class: a100-80gb, start_rps: 10 }
  - { gpu_class: h100-80gb, start_rps: 20 }
